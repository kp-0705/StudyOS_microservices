---
- name: Configure Environment Variables for StudyOS
  hosts: local
  become: false

  vars:
    mongo_uri: "mongodb://mongodb:27017/studyos"
    jwt_secret: "studyos_super_secret_key"
    auth_service_url: "http://auth-service:5002"
    task_service_url: "http://task-service:5001"

  pre_tasks:
    - name: Set project_dir from playbook location
      set_fact:
        project_dir: "{{ playbook_dir | dirname | dirname }}"

    - name: Show project_dir
      debug:
        msg: "📁 project_dir: {{ project_dir }}"

    - name: Check auth-service directory exists
      stat:
        path: "{{ project_dir }}/services/auth-service"
      register: auth_check

    - name: Fail if project structure is wrong
      fail:
        msg: "❌ Invalid project structure at {{ project_dir }}"
      when: not auth_check.stat.exists

  tasks:
    - name: Create .env for auth-service
      copy:
        dest: "{{ project_dir }}/services/auth-service/.env"
        content: |
          PORT=5002
          MONGO_URI={{ mongo_uri }}
          JWT_SECRET={{ jwt_secret }}

    - name: Create .env for task-service
      copy:
        dest: "{{ project_dir }}/services/task-service/.env"
        content: |
          PORT=5001
          MONGO_URI={{ mongo_uri }}
          JWT_SECRET={{ jwt_secret }}
          AUTH_SERVICE_URL={{ auth_service_url }}

    - name: Create .env for scheduler-service
      copy:
        dest: "{{ project_dir }}/services/scheduler-service/.env"
        content: |
          PORT=5003
          TASK_SERVICE_URL={{ task_service_url }}

    - name: Create .env for frontend
      copy:
        dest: "{{ project_dir }}/frontend/.env"
        content: |
          REACT_APP_AUTH_URL=http://localhost:5002
          REACT_APP_TASK_URL=http://localhost:5001

    - name: Success message
      debug:
        msg: "✅ All .env files created successfully!"
