---
- name: Install StudyOS Dependencies
  hosts: local
  become: false

  pre_tasks:
    - name: Set project_dir from playbook location
      set_fact:
        project_dir: "{{ playbook_dir | dirname | dirname }}"

    - name: Show resolved project directory
      debug:
        msg: "📁 project_dir: {{ project_dir }}"

    - name: Validate project structure exists
      stat:
        path: "{{ project_dir }}/services/auth-service"
      register: check_dir

    - name: Fail if project structure is wrong
      fail:
        msg: "❌ Project directory not found at {{ project_dir }}/services/auth-service"
      when: not check_dir.stat.exists

  tasks:
    - name: Check Node.js version
      command: node --version
      register: node_version
      ignore_errors: yes

    - name: Print Node version
      debug:
        msg: "Node: {{ node_version.stdout }}"

    - name: Check Docker version
      command: docker --version
      register: docker_version
      ignore_errors: yes

    - name: Print Docker version
      debug:
        msg: "Docker: {{ docker_version.stdout }}"

    - name: Install auth-service dependencies
      shell: npm install
      args:
        chdir: "{{ project_dir }}/services/auth-service"
      ignore_errors: yes

    - name: Install task-service dependencies
      shell: npm install
      args:
        chdir: "{{ project_dir }}/services/task-service"
      ignore_errors: yes

    - name: Install scheduler-service dependencies
      shell: npm install
      args:
        chdir: "{{ project_dir }}/services/scheduler-service"
      ignore_errors: yes

    - name: Install frontend dependencies
      shell: npm install
      args:
        chdir: "{{ project_dir }}/frontend"
      ignore_errors: yes

    - name: Done
      debug:
        msg: "✅ All dependencies installed successfully!"